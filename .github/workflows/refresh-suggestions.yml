name: Refresh omo suggestions

on:
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      omo_ref:
        description: "omo ref to check out (branch, tag, or SHA). Empty = newest stable tag."
        required: false
        default: ""
  # Or run on a schedule: weekly on Mondays
  schedule:
    - cron: "0 6 * * 1"

jobs:
  refresh:
    name: "Regenerate omo-suggestions.json"
    runs-on: ubuntu-latest
    # create-pull-request must push the branch (contents) and open the PR
    # (pull-requests); the repo's default token is read-only, so grant here.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout oModel
        uses: actions/checkout@v7

      # omo's default branch is `dev`, and `dev` carries UNRELEASED work: on 2026-08-10 it had
      # moved to `5.0.0-beta.4`, whose data red the suite (a new `openai-deep-research` family,
      # and `glm` gaining `max`). Tracking it also ships suggestions no released omo honours —
      # a user on stable omo would be handed variants their omo does not accept. So default to
      # the newest STABLE tag; pass `omo_ref` explicitly to snapshot a beta on purpose.
      #
      # Selection is by tag SHAPE (`vX.Y.Z`, no `-suffix`), NOT the release API: omo publishes
      # its betas with `prerelease: false`, so `releases/latest` answers `v5.0.0-beta.4` and
      # that flag cannot be trusted here. `git ls-remote` also sidesteps the API's pagination —
      # a long beta run can push the newest stable off the first page of /releases.
      - name: Resolve omo ref
        id: ref
        env:
          REQUESTED: ${{ github.event.inputs.omo_ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            echo "ref=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "using requested ref: $REQUESTED"
            exit 0
          fi
          # `|| tag=""` so an ls-remote/grep failure lands on the explicit check below with a
          # readable error, instead of `set -e` killing the step on the bare assignment.
          tag="$(git ls-remote --tags --refs https://github.com/code-yeongyu/oh-my-openagent \
                 | awk '{print $2}' | sed 's#refs/tags/##' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                 | sort -V | tail -1)" || tag=""
          # Fail loudly. An empty ref would fall through to omo's default branch — `dev`, the
          # one thing this step exists to avoid — and silently snapshot a beta anyway.
          [ -n "$tag" ] || { echo "::error::could not resolve a stable omo tag"; exit 1; }
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "newest stable omo tag: $tag"

      - name: Checkout oh-my-openagent
        uses: actions/checkout@v7
        with:
          repository: code-yeongyu/oh-my-openagent
          ref: ${{ steps.ref.outputs.ref }}
          path: oh-my-openagent
          # The extractor only reads packages/model-core/src (a self-contained
          # closure, ~240 KB) plus the root package.json. Sparse-checkout (cone
          # mode also keeps root files) avoids materializing the whole repo on
          # the runner; the default depth=1 already skips history.
          sparse-checkout: |
            packages/model-core

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install omodel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Mock `opencode` so catalog.load() degrades gracefully, exactly as CI does —
      # the validation step below must see the same environment CI would.
      - name: Create opencode mock
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "mock opencode: not available"\nexit 1\n' > "$HOME/.local/bin/opencode"
          chmod +x "$HOME/.local/bin/opencode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run snapshot extractor
        run: |
          omodel --refresh-omo --omo-src "${{ github.workspace }}/oh-my-openagent"

      - name: Check for changes
        id: diff
        run: |
          # Ignore meta-only churn: meta.generatedAt is a fresh timestamp and
          # meta.omoCommit tracks omo's dev HEAD, so the file ALWAYS differs run
          # to run even when no suggestion data changed. Compare the committed
          # file against the regenerated one with the meta block stripped, so a
          # PR opens only when real agent/category/family data actually changes.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          path = "src/omodel/data/omo-suggestions.json"
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:" + path]))
          new = json.loads(open(path).read())
          old.pop("meta", None)
          new.pop("meta", None)
          changed = old != new
          print("changed=" + ("true" if changed else "false"))
          print("data changed" if changed else "only meta changed; skipping PR", file=sys.stderr)
          PY

      # Validate the regenerated data HERE, in this job. A PR opened with GITHUB_TOKEN does
      # not trigger CI (GitHub suppresses workflow runs for token-authored events), so
      # without this the PR sits looking unchecked-but-fine while actually being untested.
      # continue-on-error so the PR still opens (the diff is worth reviewing either way) —
      # it gets a warning in its body, and the final step turns the run red.
      - name: Validate regenerated data (lint + tests)
        id: validate
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          ruff check src/ tests/
          pytest tests/ -q --tb=short

      - name: Open PR if changed
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT makes the opened PR trigger CI normally; falls back to the default token
          # (validation above still runs) when REFRESH_PAT is not configured. Fine-grained
          # PAT scopes: Contents read/write + Pull requests read/write on this repo.
          token: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
          branch: "auto/refresh-suggestions"
          title: "chore: refresh omo-suggestions.json"
          body: |
            Automated refresh of `src/omodel/data/omo-suggestions.json` from the latest
            oh-my-openagent source (${{ steps.ref.outputs.ref }}).

            ${{ steps.validate.outcome == 'failure' && '⚠️ **Validation FAILED** in the refresh run below, against the data as first pushed. Do not merge until the checks are green.' || '✅ Lint + tests passed in the refresh run below, against the data as first pushed.' }}

            <sub>Point-in-time note from the run that opened this PR. Only a later refresh
            run rewrites it, so after any other push **the checks are the source of truth**,
            not this line.</sub>

            Refresh run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the diff before merging.
          commit-message: "chore: refresh omo-suggestions.json from omo"
          # Load-bearing: without it the action falls back to `git add -A`, which would
          # sweep in the untracked oh-my-openagent/ sparse checkout as a gitlink.
          add-paths: "src/omodel/data/omo-suggestions.json"

      # Opening the PR notifies nobody: with REFRESH_PAT the author IS the repo owner, and
      # GitHub suppresses notifications for your own activity — so the weekly refresh landed
      # silently. Comment with GITHUB_TOKEN instead; that makes the actor github-actions[bot],
      # so the @mention is somebody else's, and arrives as a normal "Participating and
      # @mentions" notification (→ email, with the default notification settings). Works
      # either way: without REFRESH_PAT the bot authors the PR and the mention still lands.
      - name: Notify the owner (the PR itself can't)
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          OWNER: ${{ github.repository_owner }}
          OP: ${{ steps.cpr.outputs.pull-request-operation }}
          VALIDATION: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATION" = "success" ]; then
            status="✅ Lint + tests passed in the refresh run."
          else
            status="⚠️ **Validation FAILED** in the refresh run. Do not merge until the checks are green."
          fi
          {
            echo "@${OWNER} — the weekly omo refresh ${OP} this PR: \`omo-suggestions.json\` data changed."
            echo
            echo "$status"
            echo
            echo "Refresh run: ${RUN_URL}"
          } > "$RUNNER_TEMP/notify.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/notify.md"

      # Surface a validation failure as a red run even though the PR was allowed to open.
      - name: Fail the run if validation failed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::Test suite failed against the regenerated omo-suggestions.json"
          exit 1
